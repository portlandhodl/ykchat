[project]
name = "ykchat"
version = "0.1.0"
description = "Video chat where each participant's GPG key (e.g. on a YubiKey) continuously signs Merkle commitments to their video"
requires-python = ">=3.11"
dependencies = ["opencv-python>=4.9", "numpy>=1.26"]

[project.scripts]
ykchat = "ykchat:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
